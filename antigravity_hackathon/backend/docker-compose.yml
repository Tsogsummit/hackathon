services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edusmart
      POSTGRES_PASSWORD: edusmart
      POSTGRES_DB: edusmartmn
    # Host 5433: орон нутгийн Postgres (ихэвчлэн 5432)-той давхцахгүй
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusmart -d edusmartmn"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
